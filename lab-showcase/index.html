<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字图像处理实验展示平台</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --card:#1c2128; --bd:#30363d;
  --tx:#e6edf3; --tx2:#8b949e; --ac:#58a6ff; --ac2:#3fb950; --warn:#d29922;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--tx); line-height:1.7; font-size:15px;
}
header{
  background:linear-gradient(135deg,#1f6feb 0%,#388bfd 60%,#58a6ff 100%);
  padding:26px 32px; box-shadow:0 2px 12px rgba(0,0,0,.4);
}
header h1{font-size:23px;font-weight:600;letter-spacing:.5px}
header p{color:rgba(255,255,255,.85);font-size:13px;margin-top:5px}
.tabs{
  display:flex; flex-wrap:wrap; gap:6px; background:var(--bg2);
  padding:10px 20px; border-bottom:1px solid var(--bd);
  position:sticky; top:0; z-index:50;
}
.tab{
  padding:8px 16px; border-radius:7px; cursor:pointer; font-size:13.5px;
  color:var(--tx2); border:1px solid transparent; transition:.18s; white-space:nowrap;
  background:transparent; font-family:inherit;
}
.tab:hover{color:var(--tx);background:#21262d}
.tab.on{
  background:var(--ac); color:#0d1117; font-weight:600; border-color:var(--ac);
}
.wrap{max-width:1280px;margin:0 auto;padding:26px 22px 70px}
.panel{display:none;animation:fade .3s}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.t{
  font-size:20px;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.badge{
  font-size:11.5px;padding:3px 10px;border-radius:20px;background:#1f6feb;
  color:#fff;font-weight:500;
}
.badge.g{background:var(--ac2)}
.sub{color:var(--tx2);font-size:13.5px;margin-bottom:20px}
.sec{
  background:var(--card);border:1px solid var(--bd);border-radius:11px;
  padding:20px 22px;margin-bottom:18px;
}
.sec h3{
  font-size:16px;margin-bottom:13px;padding-bottom:9px;
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;
}
.sec h3::before{content:"";width:3px;height:15px;background:var(--ac);border-radius:2px}
.grid{display:grid;gap:15px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fig{
  background:var(--bg2);border:1px solid var(--bd);border-radius:9px;
  overflow:hidden;transition:.2s;
}
.fig:hover{border-color:var(--ac);transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fig img{width:100%;display:block;cursor:zoom-in;background:#000}
.fig .cap{
  padding:9px 12px;font-size:12.5px;color:var(--tx2);text-align:center;
  border-top:1px solid var(--bd);line-height:1.5;
}
.fig .cap b{color:var(--tx);display:block;font-size:13px;margin-bottom:2px;font-weight:600}
pre{
  background:#0a0e13;border:1px solid var(--bd);border-radius:8px;
  padding:14px 16px;overflow-x:auto;font-size:12.5px;line-height:1.65;
  font-family:"SF Mono",Menlo,Consolas,monospace;color:#c9d1d9;
}
pre .k{color:#ff7b72}.s{color:#a5d6ff}.c{color:#8b949e;font-style:italic}.f{color:#d2a8ff}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th{background:#21262d;padding:10px;text-align:center;border:1px solid var(--bd);font-weight:600;color:var(--ac)}
td{padding:9px 10px;border:1px solid var(--bd);text-align:center}
tr:nth-child(even) td{background:#161b2200}
tbody tr:hover td{background:#1f262e}
.hl{color:var(--ac2);font-weight:600}
.hl.w{color:var(--warn)}
.note{
  background:#1c2128;border-left:3px solid var(--warn);padding:12px 15px;
  border-radius:0 7px 7px 0;font-size:13.5px;color:#d9c68a;margin-top:12px;
}
.note.b{border-left-color:var(--ac);color:#a8c7fa}
.kv{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.kv span{
  background:#21262d;border:1px solid var(--bd);padding:5px 12px;
  border-radius:6px;font-size:12.5px;color:var(--tx2);
}
.kv span b{color:var(--ac);font-weight:600}
.btn{
  background:#21262d;border:1px solid var(--bd);color:var(--tx);
  padding:7px 15px;border-radius:7px;cursor:pointer;font-size:13px;
  transition:.18s;font-family:inherit;
}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.on{background:var(--ac);color:#0d1117;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
/* 对比滑块 */
.cmp{position:relative;overflow:hidden;border-radius:9px;border:1px solid var(--bd);background:#000}
.cmp img{width:100%;display:block}
.cmp .top{position:absolute;top:0;left:0;height:100%;width:50%;overflow:hidden}
.cmp .top img{width:auto;height:100%;max-width:none}
.cmp .slider{
  position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ac);
  cursor:ew-resize;z-index:5;
}
.cmp .slider::after{
  content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--ac);color:#0d1117;font-size:11px;padding:4px 5px;border-radius:4px;white-space:nowrap;
}
.cmp-wrap{max-width:560px;margin:0 auto}
.cmp-lab{
  display:flex;justify-content:space-between;font-size:12.5px;
  color:var(--tx2);margin-top:9px;
}
/* 灯箱 */
#lb{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);
  z-index:999;cursor:zoom-out;padding:22px;
}
#lb.on{display:flex;align-items:center;justify-content:center;flex-direction:column}
#lb img{max-width:96%;max-height:86%;border-radius:7px;box-shadow:0 8px 40px rgba(0,0,0,.7)}
#lb .t{color:var(--tx);margin-top:15px;font-size:14px;text-align:center}
#lb .x{position:absolute;top:18px;right:26px;color:#fff;font-size:32px;cursor:pointer;line-height:1}
/* 实时运行面板 */
.run{
  background:linear-gradient(135deg,#1a2332 0%,#1c2128 100%);
  border:1px solid #2d4a6b;border-radius:11px;padding:20px 22px;margin-bottom:18px;
}
.run h3::before{background:var(--ac2)}
.drop{
  border:2px dashed #3d4b5c;border-radius:9px;padding:24px;text-align:center;
  cursor:pointer;transition:.2s;background:#12181f;
}
.drop:hover,.drop.over{border-color:var(--ac);background:#16202b}
.drop b{display:block;color:var(--ac);font-size:14px;margin-bottom:5px}
.drop span{color:var(--tx2);font-size:12.5px}
.thumb{
  max-height:120px;margin:11px auto 0;display:none;border-radius:6px;
  border:1px solid var(--bd);
}
.status{
  margin-top:13px;padding:10px 14px;border-radius:7px;font-size:13px;
  display:none;align-items:center;gap:9px;
}
.status.show{display:flex}
.status.run{background:#1c2b1e;color:#7ee787;border:1px solid #2ea043}
.status.err{background:#2b1c1c;color:#ffa198;border:1px solid #da3633}
.spin{
  width:14px;height:14px;border:2px solid #3fb950;border-top-color:transparent;
  border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0;
}
@keyframes sp{to{transform:rotate(360deg)}}
.res{margin-top:16px;display:none}
.res.show{display:block}
.res .bar{border-top:1px solid var(--bd);padding-top:13px;margin-top:13px}
.meta{font-size:12.5px;color:var(--tx2);margin-top:9px}
.meta b{color:var(--ac2)}
.psnr{
  background:#0a0e13;border:1px solid var(--bd);border-radius:7px;
  padding:11px 14px;font-size:12px;color:#c9d1d9;white-space:pre-wrap;
  font-family:"SF Mono",Menlo,Consolas,monospace;margin-top:11px;
  max-height:220px;overflow:auto;
}
footer{
  text-align:center;padding:26px;color:var(--tx2);font-size:12.5px;
  border-top:1px solid var(--bd);margin-top:34px;
}
@media(max-width:640px){
  header{padding:20px}header h1{font-size:19px}
  .wrap{padding:16px 12px 50px}.tabs{padding:8px 10px;gap:4px}
  .tab{padding:7px 11px;font-size:12.5px}
}
</style>
</head>

<header>
  <h1>数字图像处理实验展示平台</h1>
  <p>七个实验 · 原理说明 · 核心代码 · 运行结果 · 定量分析</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="wrap" id="app"></div>

<footer>
  数字图像处理 · 实验展示 &nbsp;|&nbsp; 图片与数据均来自本机脚本实际运行结果
</footer>

<div id="lb"><span class="x" onclick="lbOff()">&times;</span><img id="lbimg"><div class="t" id="lbt"></div></div>

<script>
// ============ 图片基址 ============
const IMG='experiments/';
const P1=IMG+'exp1-histogram/images/output/';
const P2=IMG+'exp2-gamma/images/output/';
const P3=IMG+'exp3-denoising/images/output/';
const P4=IMG+'exp4-sharpening/images/output/';
const P5=IMG+'exp5-frequency-filter/images/output/';
const P6=IMG+'exp6-restoration/images/output/';
const P7=IMG+'exp7-skin-segmentation/images/output/';

// ============ 实验数据 ============
const EXPS=[
{
 id:1,name:'实验一 灰度变换与直方图',tag:'点运算',
 sub:'直方图均衡化与规定化 —— 把挤在一起的灰度"摊开"，提升对比度',
 principle:[
  ['直方图','$h(r_k)=n_k$，统计每个灰度级（0~255）出现的像素个数。'],
  ['归一化','$p(r_k)=n_k/N$，除以总像素数得到概率分布，便于不同尺寸图像比较。'],
  ['CDF 映射（核心）','$s_k=T(r_k)=(L-1)\\sum_{j=0}^{k}p(r_j)=255\\cdot CDF(r_k)$。'],
  ['为什么是 CDF','概率积分变换定理：任意随机变量经自身 CDF 变换后服从均匀分布；乘 $(L-1)$ 把 [0,1] 拉伸到 [0,255]。'],
  ['线性变换','$s=\\alpha r+\\beta$。$\\alpha$ 缩放=对比度（直方图拉伸/压缩），$\\beta$ 平移=亮度（直方图左右移动，形状不变）。'],
  ['规定化','$z=G^{-1}(T(r))$：原图均衡化→均匀→目标分布的逆均衡化。均衡化是规定化在目标取均匀分布时的特例。'],
  ['局限','全局方法、会增强噪声、灰度级简并、结果不可控（只能近似均匀）。']
 ],
 code:`<span class="c"># 直方图均衡化：CDF 映射，OpenCV 一行</span>
equalized = <span class="f">cv2.equalizeHist</span>(src)

<span class="c"># 亮度/对比度线性变换 s = alpha*r + beta</span>
<span class="k">def</span> <span class="f">adjust_brightness_contrast</span>(img, alpha=<span class="s">1.0</span>, beta=<span class="s">0.0</span>):
    <span class="k">return</span> np.clip(alpha*img.astype(np.float32)+beta, <span class="s">0</span>, <span class="s">255</span>).astype(np.uint8)

<span class="c"># 直方图规定化：源 CDF → 目标 CDF 查表</span>
<span class="k">def</span> <span class="f">histogram_matching</span>(source, reference):
    src_cdf = calc_cdf(source)      <span class="c"># 归一化累积分布</span>
    ref_cdf = calc_cdf(reference)
    lut = np.zeros(<span class="s">256</span>, dtype=np.uint8)
    <span class="k">for</span> lv <span class="k">in</span> range(<span class="s">256</span>):
        <span class="c"># 源灰度级在参考 CDF 中找最接近的灰度级</span>
        lut[lv] = np.argmin(np.abs(ref_cdf - src_cdf[lv]))
    <span class="k">return</span> lut[source]`,
 figs:[
  [P1+'compare_source_contrast_equalized_matched.png','四联对比','原图 → 对比度增强 → 均衡化 → 规定化'],
  [P1+'histograms.png','直方图对比','原图双峰集中 → 均衡化拉平铺满 0~255 → 规定化趋近参考分布'],
  [P1+'01_source.png','原图','灰度集中在 50~200'],
  [P1+'04_equalized.png','均衡化结果','直方图被拉平，对比度显著提升']
 ],
 tables:[],
 notes:['<b>答辩高频：</b>彩色图不要对 RGB 三通道分别均衡化（会严重偏色），应转到 HSV/YCrCb 只处理亮度分量 V 或 Y。']
},
{
 id:2,name:'实验二 伽马校正',tag:'幂律变换',
 sub:'s = c·r^γ —— 一条曲线决定图像是变亮还是变暗',
 principle:[
  ['幂律变换','$s=c\\cdot r^\\gamma$，本实验取 $c=1$，r 为归一化灰度。'],
  ['γ<1','曲线上凸，扩展暗部、压缩亮部 → 图像整体<b>变亮</b>，暗部细节显现。'],
  ['γ=1','恒等变换，图像不变。'],
  ['γ>1','曲线下凹，压缩暗部、扩展亮部 → 图像整体<b>变暗</b>。'],
  ['典型取值','γ=2.2 是显示器伽马值；γ=1/2.2≈0.45 常用于图像显示的伽马校正。'],
  ['对照：对数变换','$s=c\\cdot\\log(1+r)$，同样扩展暗部，但对暗部提升更剧烈。'],
  ['对照：反色','$s=255-r$，黑白反转，常用于医学影像观察。']
 ],
 code:`<span class="c"># 幂律（伽马）变换 s = c * r^gamma</span>
<span class="k">def</span> <span class="f">gamma_transform</span>(img, gamma, c=<span class="s">1.0</span>):
    table = np.array([c*((i/<span class="s">255.0</span>)**gamma)*<span class="s">255</span>
                      <span class="k">for</span> i <span class="k">in</span> range(<span class="s">256</span>)], dtype=np.float32)
    <span class="k">return</span> np.clip(table, <span class="s">0</span>, <span class="s">255</span>).astype(np.uint8)[img]

<span class="c"># 本实验对比六组参数</span>
<span class="k">for</span> g <span class="k">in</span> [<span class="s">0.4</span>, <span class="s">0.6</span>, <span class="s">1.0</span>, <span class="s">1.5</span>, <span class="s">2.2</span>, <span class="s">3.0</span>]:
    gamma_transform(src, g)`,
 figs:[
  [P2+'gamma_grid.png','γ 参数网格','0.4 / 0.6 / 1.0 / 1.5 / 2.2 / 3.0 六档对比'],
  [P2+'gamma_curves.png','伽马变换曲线簇','所有曲线过 (0,0) 与 (1,1)；γ 越小越上凸'],
  [P2+'03_log.png','对数变换','暗部提升更剧烈'],
  [P2+'02_negative.png','反色变换','s = 255-r']
 ],
 tables:[['表 1 不同 γ 取值的影响',['γ','曲线','暗部','亮部','整体'],
  [['0.4','上凸明显','扩展','压缩','显著变亮'],['0.6','上凸','扩展','压缩','变亮'],
   ['1.0','直线','不变','不变','恒等'],['1.5','下凹','压缩','扩展','变暗'],
   ['2.2','下凹明显','压缩','扩展','明显变暗'],['3.0','下凹显著','压缩','扩展','很暗']]]],
 notes:['<b>结论：</b>γ<1 用于提亮偏暗图像，γ>1 用于压暗偏亮图像。']
},
{
 id:3,name:'实验三 噪声去除',tag:'排序滤波',
 sub:'中值 vs 统计排序滤波 —— 用 PSNR 定量证明"对症下药"',
 principle:[
  ['高斯噪声','正态分布随机值叠加，整幅图均匀分布的细小颗粒。'],
  ['椒盐噪声','随机位置置 255（盐/亮点）或 0（椒/暗点），黑白孤立点。'],
  ['中值滤波','邻域灰度中值替代中心像素，对椒盐噪声最有效，边缘保持好。'],
  ['最大值滤波','即膨胀，去<b>椒</b>噪声（暗点）。'],
  ['最小值滤波','即腐蚀，去<b>盐</b>噪声（亮点）。'],
  ['中点滤波','$(max+min)/2$，对高斯与均匀噪声有效。'],
  ['修正阿尔法均值','去掉 d 个最暗与 d 个最亮后取均值，兼顾高斯与椒盐，最适合<b>混合噪声</b>。'],
  ['PSNR','峰值信噪比，dB 值越高表示失真越小、去噪效果越好。']
 ],
 code:`<span class="c"># 加高斯噪声</span>
<span class="k">def</span> <span class="f">add_gaussian_noise</span>(img, mean=<span class="s">0.0</span>, sigma=<span class="s">25.0</span>):
    noise = np.random.normal(mean, sigma, img.shape).astype(np.float32)
    <span class="k">return</span> np.clip(img.astype(np.float32)+noise, <span class="s">0</span>, <span class="s">255</span>).astype(np.uint8)

<span class="c"># 修正阿尔法均值滤波：去 d 个最暗 + d 个最亮后取均值</span>
<span class="k">def</span> <span class="f">alpha_trimmed_mean_filter</span>(img, ksize=<span class="s">3</span>, d=<span class="s">2</span>):
    pad = ksize//<span class="s">2</span>
    padded = cv2.copyMakeBorder(img, pad,pad,pad,pad, cv2.BORDER_REFLECT)
    h, w = img.shape
    out = np.zeros_like(img, dtype=np.float32)
    <span class="k">for</span> i <span class="k">in</span> range(h):
        <span class="k">for</span> j <span class="k">in</span> range(w):
            region = padded[i:i+ksize, j:j+ksize].flatten()
            region.sort()
            trimmed = region[d:region.size-d]
            out[i,j] = trimmed.mean()
    <span class="k">return</span> np.clip(out, <span class="s">0</span>, <span class="s">255</span>).astype(np.uint8)`,
 figs:[
  [P3+'02_noisy_gaussian.png','高斯噪声图','整幅均匀颗粒'],
  [P3+'03_gaussian_median_k3.png','高斯·中值 3×3','PSNR 21.97 dB（最优）'],
  [P3+'02_noisy_salt_pepper.png','椒盐噪声图','黑白孤立点'],
  [P3+'03_salt_pepper_median_k3.png','椒盐·中值 3×3','PSNR 23.30 dB（提升最大）'],
  [P3+'03_mixed_alpha_trimmed_k3.png','混合·修正阿尔法均值','19.36 → 22.91 dB'],
  [P3+'03_salt_pepper_max_k3.png','椒盐·最大值滤波','PSNR 仅 11.45 dB（误用反效果）']
 ],
 tables:[
  ['表 1 高斯噪声下各方法 PSNR',['滤波方法','PSNR (dB)','评价'],
   [['加噪后（未处理）','20.20','—'],['中值滤波 3×3','21.97','<span class="hl">最优</span>'],
    ['中值滤波 5×5','20.86','过度平滑'],['最大值滤波 3×3','13.26','<span class="hl w">不适用</span>'],
    ['最小值滤波 3×3','13.23','<span class="hl w">不适用</span>'],['中点滤波 3×3','21.08','较好']]],
  ['表 2 椒盐噪声下各方法 PSNR',['滤波方法','PSNR (dB)','评价'],
   [['加噪后（未处理）','18.63','—'],['中值滤波 3×3','23.30','<span class="hl">最优</span>'],
    ['中值滤波 5×5','21.17','较好'],['最大值滤波 3×3','11.45','<span class="hl w">不适用</span>'],
    ['最小值滤波 3×3','11.22','<span class="hl w">不适用</span>'],['中点滤波 3×3','16.47','一般']]]
 ],
 notes:[

  const el=document.getElementById('drop'+e.id);
  if(!el) return;
  el.addEventListener('dragover',ev=>{ev.preventDefault();el.classList.add('over')});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',ev=>{
    ev.preventDefault(); el.classList.remove('over');
    const f=ev.dataTransfer.files[0];
    if(f&&f.type.startsWith('image/')){
      FILES[e.id]=f;
      const t=document.getElementById('th'+e.id);
      t.src=URL.createObjectURL(f); t.style.display='block';
    }
  });
});

function setSt(id,cls,html){
  const s=document.getElementById('st'+id);
  s.className='status show '+cls;
  s.innerHTML=html;
}

async function runExp(id){
  const btn=document.getElementById('btn'+id);
  const resEl=document.getElementById('res'+id);
  btn.disabled=true; btn.textContent='运行中…';
  setSt(id,'run','<span class="spin"></span>正在调用 Python 脚本处理，请稍候…');
  resEl.classList.remove('show');

  const fd=new FormData();
  fd.append('exp',String(id));
  if(FILES[id]) fd.append('image',FILES[id]);

  try{
    const r=await fetch(API+'/api/run',{method:'POST',body:fd});
    let j;
    try{ j=await r.json() }catch(_){
      throw new Error('服务未响应，请先启动后端： /usr/bin/python3 lab-showcase/server.py');
    }
    if(!j.ok){
      setSt(id,'err','✕ '+(j.error||'运行失败')+
        (j.stderr?'<br><span style="font-size:11.5px">'+esc(j.stderr.slice(-300))+'</span>':''));
      return;
    }
    setSt(id,'run','✓ 运行完成，耗时 '+j.elapsed+' 秒');
    resEl.classList.add('show');
    let html='<div class="bar"><b style="font-size:14px">实时运行结果</b></div><div class="grid g3">';
    j.figs.forEach(f=>{
      html+=`<div class="fig"><img src="${f.url}" loading="lazy"
        onclick="lbOn('${f.url}','${f.name}')">
        <div class="cap"><b>${f.name}</b>实时生成</div></div>`;
    });
    html+='</div>';
    if(j.psnr){
      html+=`<div class="meta"><b>PSNR 报告：</b></div><div class="psnr">${esc(j.psnr)}</div>`;
    }
    html+=`<div class="meta">结果由本机 Python + OpenCV 真实运行产生 · 任务 ${j.task||''}</div>`;
    resEl.innerHTML=html;
  }catch(err){
    setSt(id,'err','✕ '+err.message);
  }finally{
    btn.disabled=false; btn.textContent='▶ 运行实验';
  }
}

// ============ 灯箱 ============
function lbOn(src,t){
  document.getElementById('lbimg').src=src;
  document.getElementById('lbt').textContent=t;
  document.getElementById('lb').classList.add('on');
}
function lbOff(){document.getElementById('lb').classList.remove('on')}
document.getElementById('lb').onclick=lbOff;
document.addEventListener('keydown',e=>{if(e.key==='Escape')lbOff()});
</script>
